name: Release Desktop

on:
  push:
    tags:
      - 'v*.*.*'
      - '!*nightly*'
      - '!*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0)'
        required: true
        default: 'v3.0.0'

jobs:
  build-and-release:
    name: Build & Release Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    steps:
      - name: Validate stable release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "Validating release tag: $TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a valid stable version tag (expected format: vX.Y.Z). Nightly or prerelease tags cannot run the stable publishing workflow."
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build Tauri Desktop (NSIS, MSI, AppImage, DEB)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'ShaPrint ${{ env.RELEASE_TAG }}'
          releaseBody: |
            ## ShaPrint Desktop (Tauri & IPP/IPPS)
            See release notes and documentation in `docs/adr/`.
          releaseDraft: false
          prerelease: false

      - name: Build and upload system packages (.deb and .rpm with daemon & GUI)
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash packaging/linux/deb/build-deb.sh
          ALMALINUX_MAJOR=10 bash packaging/linux/rpm/build-rpm.sh
          (
            cd apps/desktop/src-tauri/target/rpm
            for f in *.rpm; do
              [ -f "$f" ] && sha256sum "$f" > "${f}.sha256"
            done
          )
          gh release upload "${{ env.RELEASE_TAG }}" \
            apps/desktop/src-tauri/target/deb/*.deb \
            apps/desktop/src-tauri/target/rpm/*.rpm \
            apps/desktop/src-tauri/target/rpm/*.sha256 \
            --clobber
