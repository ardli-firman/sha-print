<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>ShaPrint: share your existing USB printer through a server computer</title>
  <rect width="1200" height="630" fill="#fcfdfb"/><rect x="790" width="410" height="630" fill="#deebe8"/>
  <g transform="translate(83 49) scale(.24)"><path fill="#126b73" d="M46 38H121V218C88.5 204 46 167 46 120Z"/><path fill="#1b292b" fill-rule="evenodd" d="M135 38H166L210 82V120C210 167 167.5 204 135 218ZM160 48V88H200Z"/></g>
