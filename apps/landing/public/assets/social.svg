    <g font-size="65" font-weight="600" letter-spacing="-3"><text x="90" y="240">Your office printer.</text><text x="90" y="325">Shared with</text><text x="90" y="410">the whole team.</text></g>
    <text x="92" y="493" font-size="22" fill="#526668">Share an existing USB printer over your local network.</text>
    <text x="92" y="531" font-size="18" fill="#526668">Windows and Linux, with an Android client.</text>
    <text x="92" y="582" font-size="18" fill="#126b73">sha-print.pages.dev</text>
