[package]
name = "shaprint-desktop"
version = "0.1.0"
description = "ShaPrint desktop shell: supervises the client proxy and server sharing runtimes"
edition = "2021"
license = "MIT"
publish = false

[lib]
# The lib name must differ from the bin name on Windows (rust-lang/cargo#8519).
name = "shaprint_desktop"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
